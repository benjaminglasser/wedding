<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chip body -->
  <circle cx="32" cy="32" r="30" fill="#b91c3c"/>

  <!-- Four cardinal wedges hint at the poker-chip edge -->
  <g fill="#fff5f5">
    <rect x="29" y="2"  width="6" height="9" rx="1"/>
    <rect x="29" y="53" width="6" height="9" rx="1"/>
    <rect x="2"  y="29" width="9" height="6" rx="1"/>
    <rect x="53" y="29" width="9" height="6" rx="1"/>
  </g>

  <!-- Inner face: red with a white stroke ring -->
  <circle cx="32" cy="32" r="20" fill="#b91c3c" stroke="#fff5f5" stroke-width="2"/>
</svg>
